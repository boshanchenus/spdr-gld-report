<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c111b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GLD 周报">
    <meta name="description" content="SPDR GLD 持仓周变化报告与历史图片">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="styles.css">
    <title>GLD 周报</title>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">SPDR GOLD SHARES</p>
        <h1>GLD 周报</h1>
      </div>
      <button id="refreshButton" class="icon-button" type="button" aria-label="刷新报告">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6.2 6.2L4 8m16 8-2.2 1.8A7 7 0 0 1 5.5 15"/></svg>
      </button>
    </header>

    <main>
      <section id="installTip" class="install-tip" hidden>
        <span>像 App 一样使用：点 Safari 的“分享”，再选“添加到主屏幕”。</span>
        <button id="closeInstallTip" type="button" aria-label="关闭提示">×</button>
      </section>

      <section id="status" class="status" aria-live="polite">正在读取报告…</section>
      <section id="latest" class="latest" hidden></section>

      <div class="section-heading">
        <h2>历史报告</h2>
        <span id="reportCount"></span>
      </div>
      <section id="history" class="history"></section>
    </main>

    <dialog id="imageDialog">
      <button id="closeDialog" class="dialog-close" type="button" aria-label="关闭">×</button>
      <img id="dialogImage" alt="GLD 报告大图">
      <p id="dialogCaption"></p>
    </dialog>

    <template id="reportTemplate">
      <article class="report-card">
        <button class="image-button" type="button">
          <img class="report-image" loading="lazy" alt="">
        </button>
        <div class="report-body">
          <div>
            <p class="report-date"></p>
            <p class="report-meta"></p>
          </div>
          <span class="change-pill"></span>
        </div>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
