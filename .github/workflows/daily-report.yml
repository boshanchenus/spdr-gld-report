name: Daily GLD report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gld-daily-report
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate report and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: python gld_weekly_chart.py --publish-dir docs --send-dingtalk --send-telegram

      - name: Save report history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports docs/reports.json
          if ! git diff --cached --quiet; then
            git commit -m "report: update GLD history"
            git push
          fi

      # A commit created with GITHUB_TOKEN does not trigger another workflow,
      # so the daily job deploys the already-generated docs directory itself.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Web App
        id: deployment
        uses: actions/deploy-pages@v4
